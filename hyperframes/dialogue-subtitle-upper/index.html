<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- DETERMINISTIC RENDER: GSAP + Thai fonts vendored locally. No CDN. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Sarabun';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('vendor/fonts/woff2/sarabun-600-thai.woff2') format('woff2');
        unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
      }
      @font-face {
        font-family: 'Sarabun';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('vendor/fonts/woff2/sarabun-700-thai.woff2') format('woff2');
        unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
      }
      @font-face {
        font-family: 'Mitr';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('vendor/fonts/woff2/mitr-700-thai.woff2') format('woff2');
        unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: transparent;
        font-family: 'Sarabun', sans-serif;
      }
      #stage { position: relative; width: 720px; height: 1280px; }

      /* Lower-third caption box — classic subtitle position. Sits above the
         feed UI overlays (TikTok / Reels / Shopee bottom chrome) so dialogue
         is never clipped by platform UI. */
      .subtitle {
        position: absolute;
        left: 50%;
        top: 220px;
        transform: translateX(-50%);
        max-width: 640px;
        padding: 22px 32px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 14px;
        color: #ffffff;
        font-family: 'Mitr', 'Sarabun', sans-serif;
        font-weight: 700;
        font-size: 56px;
        line-height: 1.25;
        letter-spacing: 0.3px;
        text-align: center;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- data-duration is the COMPOSITION duration; the actual subtitle
         play window is determined by GSAP timeline below (0.4s fade in,
         hold to 0.4s before end, 0.4s fade out). HyperFrames sets
         duration via the --variables JSON we pass at render time. -->
    <div
      id="stage"
      data-composition-id="dialogue-subtitle"
      data-start="0"
      data-duration="3"
      data-width="720"
      data-height="1280"
    >
      <div id="caption" class="subtitle" data-start="0" data-duration="3" data-track-index="1">
        <!-- Placeholder text — overridden by HyperFrames via getVariables() -->
        Loading subtitle…
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Pull dialogue text + composition duration from --variables JSON.
      // HyperFrames exposes them on window.__hyperframes.getVariables().
      const vars = (window.__hyperframes && window.__hyperframes.getVariables)
        ? window.__hyperframes.getVariables()
        : {};
      const text = vars.text_th || vars.text || "";
      const compDuration = parseFloat(vars.duration_s || vars.duration || 3);

      const el = document.getElementById("caption");
      if (text) el.textContent = text;

      // Also update the stage data-duration so HyperFrames renders the
      // correct composition length (otherwise the MOV is the default 3s).
      document.getElementById("stage").setAttribute("data-duration", compDuration);
      el.setAttribute("data-duration", compDuration);

      // Fade-in (0.4s) → hold → fade-out (0.4s).
      // Hold = compDuration - 0.8s. If compDuration < 0.8s, the timeline
      // degenerates to a quick blink — that's the right thing for very
      // short captions.
      const FADE = 0.4;
      const hold = Math.max(0, compDuration - 2 * FADE);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#caption", { opacity: 0, y: 12 },
                { opacity: 1, y: 0, duration: FADE, ease: "power2.out" }, 0);
      tl.to("#caption", { opacity: 0, duration: FADE, ease: "power2.in" },
            FADE + hold);
      window.__timelines["dialogue-subtitle"] = tl;
    </script>
  </body>
</html>
