<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#000; }
      @font-face {
        font-family:'Noto Sans Thai';
        src:url('assets/fonts/NotoSansThai-Bold.ttf') format('truetype');
        font-weight:100 900;
      }
      .thai { font-family:'Noto Sans Thai', sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.7"
         data-width="1080" data-height="1920">
      <video id="a-roll" class="clip" src="S1.mp4" muted playsinline
             data-start="0" data-duration="4.7" data-track-index="0"
             style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover"></video>

      <audio id="vo" src="vo.mp3" data-start="0" data-duration="4.7" data-track-index="2" data-volume="1"></audio>

      <div id="cap" class="clip thai" data-start="0.3" data-duration="4.2" data-track-index="1"
           style="position:absolute; bottom:560px; left:40px; right:40px; text-align:center;
                  font-size:64px; font-weight:900; color:#fff; line-height:1.3; text-shadow:0 3px 16px #000;">
        <span style="background:rgba(0,0,0,.55); padding:14px 26px; border-radius:18px;">ร่มเปียก = ศัตรูหน้าฝน 🌧️</span>
      </div>

      <div id="lt" class="clip thai" data-start="1.2" data-duration="3.5" data-track-index="3"
           style="position:absolute; bottom:120px; left:0; right:0; height:150px; background:rgba(10,12,18,.92);
                  display:flex; align-items:center; justify-content:space-between; padding:0 48px;">
        <span style="color:#fff; font-size:46px; font-weight:900;">JIAP DEALS</span>
        <span id="price" style="color:#ff6b35; font-size:72px; font-weight:900;">฿335</span>
        <span style="background:#ff8c42; color:#fff; font-size:38px; font-weight:900; padding:14px 30px; border-radius:12px;">กดตะกร้าส้ม</span>
      </div>

      <div id="disc" class="clip thai" data-start="0" data-duration="4.7" data-track-index="4"
           style="position:absolute; top:36px; right:30px; font-size:30px; color:#eee;
                  background:rgba(0,0,0,.45); padding:6px 14px; border-radius:10px;">#โฆษณา</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('#cap',   { opacity:0, y:60, duration:0.35 }, 0.3);
      tl.from('#lt',    { opacity:0, y:160, duration:0.45 }, 1.2);
      tl.to('#price',   { scale:1.15, duration:0.25, yoyo:true, repeat:1, transformOrigin:'center' }, 1.7);
      tl.set({}, {}, 4.7);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
