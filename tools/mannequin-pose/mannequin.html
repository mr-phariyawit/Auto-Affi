<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#1b1b1b;overflow:hidden;font-family:-apple-system,Helvetica,sans-serif}
  canvas{display:block}
  #label{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:rgba(0,0,0,.62);color:#eee;font-size:22px;line-height:1.3}
  #label b{color:#ffd38a;font-size:26px}
  #label small{display:block;color:#bbb;font-size:17px;margin-top:4px}
</style></head><body>
<div id="label"></div>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';
import { POSES } from './poses.js';
import { buildObject, legacyToObjects } from './objlib.js';

const q = new URLSearchParams(location.search);
const id = q.get('pose') || (q.get('json') ? q.get('json').replace(/.*\//,'').replace(/\.json$/,'') : 'B');
const P = q.get('json') ? await (await fetch(q.get('json'))).json() : POSES[id];
if (!P.title) P.title = id; if (!P.notes) P.notes = '';
if (!P.cam) P.cam = {pos:[0.4,1.2,3.4], target:[0,0.95,0], fov:38};
if (!P.light) P.light = {keyPos:[-2.5,2.6,2.4], color:0xfff2e0, intensity:2.2, ambient:0.35};
if (!P.pose) P.pose = {};
const W = innerWidth, H = innerHeight;
const D = Math.PI/180;

const scene = new THREE.Scene();
scene.background = new THREE.Color(P.bg || 0x2a2a2a);
const cam = new THREE.PerspectiveCamera(P.cam.fov||40, W/H, 0.05, 100);
cam.position.set(...P.cam.pos); cam.lookAt(new THREE.Vector3(...P.cam.target));

const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

// ---------- lights (key direction is part of the draft) ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, P.light.ambient ?? 0.5));
const key = new THREE.DirectionalLight(P.light.color || 0xffffff, P.light.intensity ?? 2.2);
key.position.set(...P.light.keyPos); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-3; key.shadow.camera.right=3;
key.shadow.camera.top=3; key.shadow.camera.bottom=-3; key.shadow.bias=-0.0005;
scene.add(key, key.target);
if (P.light.rimPos){ const rim=new THREE.DirectionalLight(P.light.rimColor||0xaaccff, P.light.rimIntensity||1.2); rim.position.set(...P.light.rimPos); scene.add(rim); }

// ---------- materials ----------
const wood = new THREE.MeshStandardMaterial({color:0xc9a06a, roughness:0.75, metalness:0});
const joint = new THREE.MeshStandardMaterial({color:0x8c6a3f, roughness:0.6});
const burst = new THREE.MeshStandardMaterial({color:0xc5752b, roughness:0.4});
const dark  = new THREE.MeshStandardMaterial({color:0x2b1a10, roughness:0.5});
const metal = new THREE.MeshStandardMaterial({color:0x777777, roughness:0.3, metalness:0.8});
const prop  = new THREE.MeshStandardMaterial({color:0x555555, roughness:0.9});

const sh = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const ball = (r,mat=joint) => sh(new THREE.Mesh(new THREE.SphereGeometry(r,24,16), mat));
// segment hanging DOWN (-Y) from its joint; returns group (the joint) and end anchor
function limb(len, r, mat=wood){
  const g = new THREE.Group();
  g.add(ball(r*1.15));
  const m = sh(new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(len-2*r,0.01), 6, 16), mat));
  m.position.y = -len/2; g.add(m);
  const end = new THREE.Group(); end.position.y = -len; g.add(end);
  return {g, end};
}
// segment going UP (+Y) from joint (torso stack)
function stack(len, rx, ry, rz, mat=wood){
  const g = new THREE.Group();
  const m = sh(new THREE.Mesh(new THREE.SphereGeometry(1,24,16), mat));
  m.scale.set(rx, len/2, rz); m.position.y = len/2; g.add(m);
  const end = new THREE.Group(); end.position.y = len; g.add(end);
  return {g, end};
}

// ---------- mannequin ----------
const pose = P.pose;
const rot = (obj, x=0,y=0,z=0, order='YXZ') => { obj.rotation.order = order; obj.rotation.set(x*D, y*D, z*D); };

const root = new THREE.Group();
root.position.set(...(pose.rootPos || [0,0.98,0]));
rot(root, 0, pose.bodyYaw||0, 0);
scene.add(root);

const pelvis = sh(new THREE.Mesh(new THREE.SphereGeometry(1,24,16), wood));
pelvis.scale.set(0.17,0.11,0.12); root.add(pelvis);

const lower = stack(0.22, 0.15, 1, 0.11); rot(lower.g, pose.spineLean||0, pose.spineTwist||0, pose.spineTilt||0); lower.g.position.y=0.08; root.add(lower.g);
const chest = stack(0.30, 0.19, 1, 0.13); rot(chest.g, (pose.chestLean||0), (pose.chestTwist||0), 0); lower.end.add(chest.g);
const neck  = limb(0.0,0.045); // placeholder joint
const neckG = new THREE.Group(); neckG.position.y = 0.0; chest.end.add(neckG);
const neckM = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,0.09,16), wood)); neckM.position.y=0.045; neckG.add(neckM);
const headG = new THREE.Group(); headG.position.y=0.09; neckG.add(headG);
rot(headG, pose.headPitch||0, pose.headYaw||0, pose.headTilt||0);
const head = sh(new THREE.Mesh(new THREE.SphereGeometry(1,32,24), wood)); head.scale.set(0.095,0.12,0.105); head.position.y=0.12; headG.add(head);
// face marker (nose) so the facing direction is readable in the draft
const nose = sh(new THREE.Mesh(new THREE.ConeGeometry(0.018,0.04,12), joint)); nose.rotation.x=Math.PI/2; nose.position.set(0,0.11,0.105); headG.add(nose);

function arm(side, a){ // side +1 = figure's LEFT (world +X when facing +Z), -1 = RIGHT
  const sh0 = new THREE.Group(); sh0.position.set(side*0.21, 0.27, 0); chest.g.add(sh0);
  const up = limb(0.30, 0.045);
  rot(up.g, -(a.fwd||0), (a.twist||0), side*(a.out||0), 'ZXY');
  sh0.add(up.g);
  const fo = limb(0.27, 0.04); rot(fo.g, -(a.bend||0), (a.foreTwist||0), 0); up.end.add(fo.g);
  const hand = sh(new THREE.Mesh(new THREE.SphereGeometry(1,16,12), joint)); hand.scale.set(0.04,0.07,0.025); hand.position.y=-0.06; fo.end.add(hand);
  return fo.end;
}
arm(+1, pose.armL||{}); arm(-1, pose.armR||{});

function leg(side, l){
  const hip = new THREE.Group(); hip.position.set(side*0.10, -0.05, 0); root.add(hip);
  const th = limb(0.43, 0.065); rot(th.g, -(l.fwd||0), (l.twist||0), side*(l.out||0), 'ZXY'); hip.add(th.g);
  const sn = limb(0.42, 0.05); rot(sn.g, (l.bend||0), 0, 0); th.end.add(sn.g);
  const ft = sh(new THREE.Mesh(new THREE.BoxGeometry(0.08,0.05,0.25), joint)); ft.position.set(0,-0.025,0.08); ft.rotation.x = -(l.foot||0)*D; sn.end.add(ft);
}
leg(+1, pose.legL||{}); leg(-1, pose.legR||{});

// ---------- objects (shared library; legacy guitar/props/wall converted) ----------
const objs = P.objects || legacyToObjects(P);
for (const ob of objs){
  if (ob.kind==='spot'){ const sp=new THREE.SpotLight(0xffffff, ob.intensity||40, 8, 0.45, 0.6, 1.2); sp.position.set(...ob.pos); sp.target.position.set(...(ob.target||[0,1.2,0])); sp.castShadow=true; scene.add(sp, sp.target); continue; }
  const g = buildObject(THREE, ob, sh); if (g) scene.add(g);
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12,12), new THREE.MeshStandardMaterial({color:P.floor||0x3a3a3a, roughness:1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

// ---------- frame guides + label ----------
document.getElementById('label').innerHTML = `<b>${id} — ${P.title}</b><small>${P.notes}</small>`;
renderer.render(scene, cam);
window.__done = true;
</script></body></html>
