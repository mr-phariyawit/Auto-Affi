<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khao Pad — pixel kitchen EP04</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --page: #151b22; --panel: #1f2933; --ink: #f2ead8; --muted: #9fb0bf;
    --accent: #ffd35a; --chili: #e0553b; --herb: #6cc05e; --line: #34475a;
    --display: "Pixelify Sans", "Courier New", monospace;
    --body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    --thai: "Sarabun", "Noto Sans Thai", "IBM Plex Sans Thai", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font-family: var(--body); line-height: 1.6; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .stage { flex: 0 0 auto; width: min(100%, 360px); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .notes { flex: 1 1 320px; min-width: 0; max-width: 62ch; }

  .frame { position: relative; width: 100%; aspect-ratio: 9 / 16; container-type: inline-size;
           border: 2px solid var(--line); background: #2b3a4a; overflow: hidden; font-family: var(--display); line-height: 1; font-variant-ligatures: none; }
  .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  /* fx canvas: B=264 → (264+8)*6/1920 = 272*6/1920 = 85.0% */
  .frame #fx { inset: auto 0 0 0; top: 69.375%; height: 30.625%;   /* v2: explicit height — the base canvas rule (height:100%) stretched it to 1920 px */
 image-rendering: auto; border-top: .7cqw solid #c98f4e; }
  .frame #insetimg { position: absolute; left: 65.56%; top: 16.25%; width: 26.67%; height: auto; aspect-ratio: 1; display: block; object-fit: cover; }
  .ov { position: absolute; left: 6%; right: 6%; color: var(--ink); }
  .title { top: 3%; text-align: center; }
  .title .t1 { font-size: 9.6cqw; font-weight: 700; line-height: 1; letter-spacing: .02em; }
  .title .t2 { font-size: 4.2cqw; color: var(--accent); margin-top: .9cqw; line-height: 1; }
  .rail { top: 11.7%; display: flex; justify-content: space-between; align-items: center; }
  .rail::before { content: ""; position: absolute; left: 2%; right: 2%; top: 50%; height: .7cqw; background: var(--line); transform: translateY(-50%); }
  .rail button { position: relative; width: 6.4cqw; height: 6.4cqw; padding: 0; border: .7cqw solid var(--ink); background: #2b3a4a; color: var(--ink);
                 font: 600 3.4cqw/1 var(--display); cursor: pointer; }
  .rail button.done { background: var(--chili); }
  .rail button.now  { background: var(--accent); color: #151b22; }
  .rail button:focus-visible, .ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* meters */
  .meter { top: 15.625%; height: 16.42%; right: 40%; display: grid; align-content: space-between; }
  .meter .lab { font-size: 3.2cqw; color: var(--accent); letter-spacing: .06em; }
  .meter .row { display: grid; grid-template-columns: 14cqw 1fr; align-items: center; gap: 1.5cqw; font-size: 3.2cqw; height: 3.2cqw; }
  .meter .track { position: relative; height: 2.2cqw; background: #151b22; border: .5cqw solid var(--ink); }
  .meter .fill  { height: 100%; width: 0; background: var(--chili); transition: width .5s steps(8, end); }
  .meter .fill.sp { background: var(--herb); }
  .meter .tick  { position: absolute; top: -.7cqw; bottom: -.7cqw; width: .6cqw; background: var(--accent); }
  /* step card */
  .card { top: 32.9%; height: 10.6%; background: #151b22; border: .7cqw solid var(--ink); padding: 1.3cqw 2.6cqw; display: flex; flex-direction: column; justify-content: center; }
  .frame .ov.card { display: none; }   /* v2 (owner 2026-11-18): the step card is replaced by the subtitle */
  .card .l1  { font-size: 5.2cqw; font-weight: 700; line-height: 1.05; }
  .card .l2  { font-size: 3.9cqw; color: var(--herb); line-height: 1.2; margin-top: .6cqw; }
  .card .src { font-size: 2.8cqw; color: var(--muted); text-align: right; margin-top: .5cqw; min-height: 2.8cqw; }
  /* subtitle band: sits between card bottom (~43.5%) and chef head (54%) */
  /* right: 17% (wider than 27.8%) so sub8's 37-char line 2 clears at 3.5cqw */
  /* v2 (owner 2026-11-18): subtitle replaces the step card. Box x 120–888, y ~628–838 (above the y 840 safe-area step). */
  .subtitle { position: absolute; left: 11.1%; right: 17.8%; top: 32.7%; height: 10.9%; pointer-events: none; }
  .sub-box  { background: #151b22; border: .7cqw solid var(--ink); box-sizing: border-box; height: 100%; padding: 1.2cqw 2.6cqw; display: flex; flex-direction: column; justify-content: center; }
  .sub-en   { font-family: var(--body); font-size: 3.6cqw; font-weight: 600; color: #f2ead8; line-height: 1.2; white-space: pre-line; }
  .sub-th   { font-family: var(--thai); font-size: 2.35cqw; font-weight: 400; color: #ddd0ba; line-height: 1.35; margin-top: .5cqw; white-space: pre-line; }
  /* watermark */
  .num { font-family: var(--body); font-weight: 700; }
  .rail button { font-family: var(--body); font-weight: 700; }
  .wm { top: 96.4%; text-align: center; font-size: 3.4cqw; font-family: var(--body); font-weight: 700; color: var(--ink); text-shadow: 0 0 .8cqw #000, 0 0 .4cqw #000; }
  /* end card */
  #endcard { display: none; position: absolute; inset: 0; z-index: 20; background: rgba(21,27,34,.98); flex-direction: column; justify-content: center; gap: 5cqw; padding: 0 20% 0 11%; }
  #endcard .bx  { border: .7cqw solid var(--ink); background: #2b3a4a; padding: 3.4cqw; }
  #endcard .hd  { font-size: 6.6cqw; font-weight: 700; color: var(--accent); }
  #endcard .bd  { font-size: 4.7cqw; line-height: 1.25; margin-top: 1.8cqw; }
  #endcard .tag { font-size: 3.3cqw; color: var(--muted); margin-top: 1.8cqw; }
  /* render mode: bare 1080x1920 */
  html.render body { background: #000; }
  html.render .wrap { padding: 0; max-width: none; display: block; }
  html.render .stage { width: 1080px; margin: 0; gap: 0; }
  html.render .frame { border: 0; }
  html.render .ctl, html.render .notes { display: none; }
  html.render .meter .fill { transition: none; }
  /* controls */
  .ctl { display: flex; flex-wrap: wrap; gap: 10px; }
  .ctl button { font: 600 15px/1 var(--display); padding: 10px 14px; background: var(--panel); color: var(--ink); border: 2px solid var(--line); cursor: pointer; }
  .ctl button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .ctl .seg { display: flex; }
  .ctl .seg button + button { border-left: 0; }
  h1, h2, .ctl button { font-variant-ligatures: none; }
  h1 { font: 700 30px/1.15 var(--display); margin: 0 0 6px; }
  h2 { font: 600 19px/1.25 var(--display); color: var(--accent); margin: 26px 0 6px; }
  p, li { font-size: 15.5px; }
  p { margin: 0 0 10px; }
  ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .lede { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .meter .fill { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="frame" id="frame">
      <canvas id="cv" width="180" height="320" role="img" aria-label="Pixel-art kitchen: a chef stir-fries Thai fried rice"></canvas>
      <img id="insetimg" alt="" width="264" height="264">
      <canvas id="fx" width="720" height="392" role="img" aria-label="Realistic close-up of the cooking stage with smoke and sizzle effects"></canvas>
      <div class="ov title"><div class="t1">Khao Pad</div><div class="t2">Thai fried rice</div></div>
      <div class="ov rail" id="rail"></div>
      <div class="ov meter">
        <div class="lab" id="mlab">TARGET</div>
        <div class="row"><span>Salty</span><div class="track"><div class="fill" id="f0"></div></div></div>
        <div class="row"><span>Sweet</span><div class="track"><div class="fill" id="f1"></div></div></div>
        <div class="row"><span>Sour</span><div class="track"><div class="fill" id="f2"></div></div></div>
        <div class="row"><span>Spicy</span><div class="track"><div class="fill" id="f3"></div></div></div>
      </div>
      <div class="ov card"><div class="l1" id="l1">Target taste</div><div class="l2" id="l2">Sour · sweet · salty, equal</div><div class="src" id="src"></div></div>
      <!-- subtitle band: between card bottom and chef head -->
      <div class="subtitle" id="subtitle">
        <div class="sub-box">
          <div class="sub-en" id="sub-en"></div>
          <div class="sub-th" id="sub-th"></div>
        </div>
      </div>
      <div id="endcard">
        <div class="bx"><div class="hd">In Thailand?</div><div class="bd">Affiliate links in the caption</div><div class="tag">Ad · affiliate link</div></div>
        <div class="bx"><div class="hd">No crab?</div><div class="bd">Use shrimp, pork or chicken</div></div>
      </div>
      <div class="ov wm">@saitum528</div>
    </div>
    <div class="ctl">
      <button id="play" type="button" aria-pressed="true">Pause</button>
      <button id="snd" type="button" aria-pressed="false">Sound: off</button>
      <div class="seg" role="group" aria-label="Close-up art source">
        <button id="mR" type="button" aria-pressed="true">Realistic</button>
        <button id="mB" type="button" aria-pressed="false">Pixelated art</button>
        <button id="mA" type="button" aria-pressed="false">Code sprites</button>
      </div>
    </div>
  </div>
  <div class="notes">
    <h1>EP04 Khao Pad — pixel kitchen</h1>
    <p class="lede">8 steps through khao pad, pixel kitchen style.</p>
  </div>
</div>

<script>
const IMGS      = /*__IMGS__*/{};
const UNDER     = /*__UNDER__*/{};
const REAL      = /*__REAL__*/{};
const INSET_REAL= /*__INSET_REAL__*/{};

const W = 180, H = 320, cv = document.getElementById('cv'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const C = { wall:'#2b3a4a', tile:'#34475a', floor:'#1a222b', top:'#c98f4e', topHi:'#e0aa66', front:'#8a5a2e', drawer:'#6f4622',
  steel:'#1e2229', steel2:'#3a404b', flame:'#ff9a2e', flame2:'#ffd35a', white:'#f2ead8', shade:'#cfc5ae', skin:'#e0a878', skin2:'#b97f55',
  red:'#d1432b', red2:'#a02e1c', green:'#4f9a45', green2:'#2f6b34', pink:'#e8908a', pink2:'#c9655f', brown:'#8a5330', brown2:'#6a3c20',
  amber:'#d98a1e', amber2:'#f0b040', glass:'#9fd0d6', pepK:'#2a2622', pepK2:'#57504a', pepW:'#d8cdb4', pepW2:'#b3a88e', yolk:'#f5b21a',
  rice:'#f7f3e8', plate:'#e9e4d6', plate2:'#b9b3a3', stone:'#7d8088', stone2:'#5c5f66', steam:'#5d7286', inset:'#1b2530', accent:'#ffd35a', ink:'#f2ead8' };
const R   = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function ell(cx, cy, rx, ry, c, half) {
  for (let y = -ry; y <= ry; y++) {
    if (half === 'bottom' && y < 0) continue; if (half === 'top' && y > 0) continue;
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.01)))); R(cx - w, cy + y, 2 * w + 1, 1, c);
  }
}
function seg(x0, y0, x1, y1, th, c) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
  for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / (n || 1), y0 + (y1 - y0) * i / (n || 1), th, th, c);
}
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// EP04 steps — id for content lookup, k for behaviour (chef pose, props, pixel wok, sounds)
// Meter = which tastes are in the wok / on the plate so far (no target ticks: no source gives khao pad a fixed balance)
const STEPS = [
  { id:'target', k:'target', l1:'Khao pad',       l2:'Thai fried rice',               src:'Mark Wiens',            m:[60,15,50,40], lab:'ON THE PLATE' },
  { id:'rice',   k:'target', l1:'Jasmine rice',   l2:'Rice 1 : water 1',              src:'Pailin · Mark Wiens',   m:[0,0,0,0],     lab:'IN THE WOK' },
  { id:'garlic', k:'pork',   l1:'Garlic',         l2:'Medium heat, just golden',      src:'Pailin',                m:[0,0,0,0],     lab:'IN THE WOK' },
  { id:'egg',    k:'pork',   l1:'Eggs',           l2:'High heat, half set',           src:'Pailin',                m:[0,0,0,0],     lab:'IN THE WOK' },
  { id:'season', k:'sauce',  l1:'Season',         l2:'Thai soy · fish sauce · white pepper', src:'Pailin',         m:[60,0,0,10],   lab:'IN THE WOK' },
  { id:'sugar',  k:'pepper', l1:'A little sugar', l2:'Balances salt, not sweet',      src:'Pailin · Hungry in Thailand', m:[60,15,0,10], lab:'IN THE WOK' },
  { id:'crab',   k:'basil',  l1:'Crab',           l2:'Or shrimp, pork, chicken',      src:'Pailin',                m:[60,15,0,10],  lab:'IN THE WOK' },
  { id:'serve',  k:'serve',  l1:'Serve',          l2:'Lime · cucumber · prik nam pla', src:'Pailin',               m:[60,15,50,40], lab:'ON THE PLATE' }
];

// Subtitle lines — one per step, text = approved script v1 (EN main, TH smaller)
const SUBS = [
  { en:'Khao pad, Thai fried rice, served at nearly every street stall.',
    th:'ข้าวผัด มีขายแทบทุกร้านริมทาง' },
  { en:'Cook jasmine rice drier: one cup rice, one cup water.',
    th:'หุงข้าวหอมมะลิให้แห้งขึ้น ข้าวหนึ่งถ้วย น้ำหนึ่งถ้วย' },
  { en:'Fry garlic on medium heat until the smallest bits turn golden.',
    th:'เจียวกระเทียมไฟกลาง จนชิ้นเล็กเริ่มเหลือง' },
  { en:'Turn the heat up. Eggs go in, only half set.',
    th:'เร่งไฟแรง ใส่ไข่ ให้สุกแค่ครึ่งเดียว' },
  { en:'Season with Thai soy sauce, fish sauce, and white pepper.',
    th:'ปรุงด้วยซีอิ๊วขาวแบบไทย น้ำปลา และพริกไทยขาว' },
  { en:'A little sugar balances the salt. It should not taste sweet.',
    th:'น้ำตาลนิดเดียวช่วยตัดเค็ม ข้าวต้องไม่หวาน' },
  { en:'Crab is arguably Thailand’s favourite.\nNo crab? Use shrimp, pork, or chicken.',
    th:'ข้าวผัดปูน่าจะนิยมที่สุดในไทย\nไม่มีปู ใช้กุ้ง หมู หรือไก่' },
  { en:'Always serve lime. Add cucumber and prik nam pla.\nIn Thailand, affiliate links are in the caption.',
    th:'เสิร์ฟกับมะนาวเสมอ เพิ่มแตงกวาและพริกน้ำปลา\nอยู่ไทย ลิงก์แอฟฟิลิเอตอยู่ในแคปชัน', k:0.73 }
];

const DUR = 3600;
// B = 243 (shifted down from EP01's 214 to open subtitle band)
const B = 214, IX = 118, IY = 52;   // v2: back to EP01 position (subtitle moved into the card slot)
const imgs  = {}; for (const k in IMGS)  { const im = new Image(); im.src = IMGS[k];       imgs[k]  = im; }
const under = {}; for (const k in UNDER) { const im = new Image(); im.src = UNDER[k].src;  under[k] = im; }
const UNDER_FOR = { target:'dish', pound:'mortar', pork:'wok', sauce:'wok', pepper:'wok', basil:'basil', serve:'dish' };
let mode = 'R', playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, T = 0, last = performance.now(), shown = -1;

/* ---------- close-up sprites (unchanged from EP01, keyed by st.k) ---------- */
function chilli(ox, oy, x0, y0, x1, y1, bend, col, col2) {
  for (let i = 0; i <= 22; i++) { const t = i / 22, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t + Math.sin(t * Math.PI) * bend, th = Math.max(1, Math.round(5 - 4 * t));
    R(ox + x, oy + y - th / 2, 2, th, col); if (th > 2) R(ox + x, oy + y - th / 2, 2, 1, col2); }
  R(ox + x0 - 3, oy + y0 - 2, 4, 2, C.green2); R(ox + x0 - 5, oy + y0 - 4, 2, 3, C.green2);
}
function leaf(ox, oy, cx, cy, len, wid, dx, dy) {
  for (let i = 0; i < len; i++) { const t = i / (len - 1), w = Math.max(1, Math.round(wid * Math.sin(Math.PI * Math.pow(t, 0.8)))) + (i % 3 === 0 ? 1 : 0);
    const x = cx + dx * i, y = cy + dy * i; R(ox + x - w * Math.abs(dy), oy + y - w * Math.abs(dx), dy ? 2 * w + 1 : 1, dx ? 2 * w + 1 : 1, i % 3 === 0 ? C.green2 : C.green); }
  for (let i = 0; i < len; i++) R(ox + cx + dx * i, oy + cy + dy * i, 1, 1, '#8fd07f');
}
function dishSprite(ox, oy, s) {
  const q = v => Math.round(v * s);
  ell(ox + q(24), oy + q(28), q(22), q(14), C.plate2); ell(ox + q(24), oy + q(27), q(22), q(14), C.plate); ell(ox + q(24), oy + q(27), q(18), q(11), '#f4f0e4');
  ell(ox + q(15), oy + q(29), q(9), q(6), C.rice);
  ell(ox + q(32), oy + q(28), q(10), q(7), C.brown);
  for (let i = 0; i < 14 * s; i++) { const a = rnd(i) * 6.28, r = rnd(i + 50); R(ox + q(32) + Math.cos(a) * q(8) * r, oy + q(28) + Math.sin(a) * q(5) * r, 1, 1, i % 3 ? (i % 2 ? C.red : C.green) : C.brown2); }
  ell(ox + q(17), oy + q(21), q(8), q(5), C.white); ell(ox + q(17), oy + q(21), q(3), q(2), C.yolk);
  if (s === 1) { for (let i = 0; i < 9; i++) { const a = i / 9 * 6.28; R(ox + 17 + Math.cos(a) * 8, oy + 21 + Math.sin(a) * 5, 2, 1, '#c98a3e'); }
    R(ox + 29, oy + 24, 4, 2, C.green2); R(ox + 34, oy + 30, 4, 2, C.green2); R(ox + 37, oy + 25, 3, 2, C.green); }
}
function insetSprite(k, ox, oy) {
  if (k === 'target' || k === 'serve') dishSprite(ox, oy, 1);
  else if (k === 'sauce') { R(ox + 20, oy + 3, 8, 4, C.red); R(ox + 21, oy + 7, 6, 8, C.glass); R(ox + 15, oy + 15, 18, 29, C.amber); R(ox + 16, oy + 16, 2, 26, C.amber2);
    R(ox + 31, oy + 16, 1, 27, '#a8660f'); R(ox + 18, oy + 23, 12, 13, C.white); }
  else if (k === 'pork') { ell(ox + 24, oy + 29, 17, 10, C.pink2); ell(ox + 24, oy + 27, 17, 10, C.pink);
    for (let i = 0; i < 46; i++) { const a = rnd(i) * 6.28, r = Math.sqrt(rnd(i + 9)); R(ox + 24 + Math.cos(a) * 15 * r, oy + 27 + Math.sin(a) * 8 * r, i % 4 === 0 ? 3 : 2, 1, i % 3 === 0 ? C.white : (i % 3 === 1 ? C.pink2 : '#f4b0aa')); } }
  else if (k === 'basil') { seg(ox + 24, oy + 44, ox + 24, oy + 10, 1, '#7a4a6a'); leaf(ox, oy, 23, 12, 16, 5, -1, 0); leaf(ox, oy, 25, 16, 16, 5, 1, 0); leaf(ox, oy, 23, 28, 14, 4, -1, 0); leaf(ox, oy, 25, 32, 14, 4, 1, 0);
    for (let i = 0; i < 5; i++) R(ox + 23 + (i % 2) * 2, oy + 4 + i * 1.4, 2, 1, '#e7b6d0'); }
}
function drawInset(st, tick) {
  R(IX - 2, IY - 2, 52, 52, C.accent); R(IX, IY, 48, 48, C.inset);
  const bob = (tick % 12 < 6) ? 0 : 1, k = st.k, im = imgs[k];
  if (mode === 'B' && im && im.complete && im.naturalWidth) g.drawImage(im, IX, IY + bob);
  else insetSprite(k, IX, IY + bob);
}

/* ---------- kitchen diorama ---------- */
function kitchen() {
  R(0, 0, W, H, C.wall);
  for (let y = 150; y < B; y += 16) R(0, y, W, 1, C.tile);
  for (let x = 10; x < W; x += 20) R(x, 150, 1, B - 150, C.tile);
  R(0, B + 52, W, H - B - 52, C.floor);
  ell(88, B + 52, 16, 2, '#141a21');
  R(80, B + 8, 7, 40, '#2a3038'); R(90, B + 8, 7, 40, '#232830');
  R(78, B + 47, 10, 5, C.steel); R(89, B + 47, 10, 5, C.steel);
  R(84, B + 8, 9, 14, C.white); R(84, B + 20, 9, 2, C.shade);
}
const SHELF = B - 38;
function props(st, p, tick, idx) {

const rail = document.getElementById('rail');
STEPS.forEach((s, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = i === 0 ? '★' : i;
  b.setAttribute('aria-label', 'Step: ' + s.l1); b.addEventListener('click', () => { T = i * DUR + 1; shown = -1; stepSerial = -1; draw(); }); rail.appendChild(b); });

const playBtn = document.getElementById('play');
function setPlay(v) { playing = v; playBtn.textContent = v ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', v); last = performance.now(); musicSync(); }
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', async () => {
  if (!actx) { sndBtn.textContent = 'Sound: loading'; const ok = await soundInit().catch(() => false); if (!ok) { sndBtn.textContent = 'Sound unavailable'; return; } }
  soundOn = !soundOn; sndBtn.textContent = soundOn ? 'Sound: on' : 'Sound: off'; sndBtn.setAttribute('aria-pressed', soundOn); musicSync();
});
playBtn.addEventListener('click', () => setPlay(!playing));
const mR = document.getElementById('mR'), mA = document.getElementById('mA'), mB = document.getElementById('mB');
function setMode(m) { mode = m; mR.setAttribute('aria-pressed', m === 'R'); mA.setAttribute('aria-pressed', m === 'A'); mB.setAttribute('aria-pressed', m === 'B'); shown = -1; draw(); }
mR.addEventListener('click', () => setMode('R')); mA.addEventListener('click', () => setMode('A')); mB.addEventListener('click', () => setMode('B'));
setPlay(playing);
let lastRaf = 0;
function frame(now) {
  if (playing) T += Math.max(0, Math.min(100, now - last));
  last = now;
  try { draw(); if (playing) soundTick(); } catch(e) { console.error(e); }
}
function loop(now) { lastRaf = performance.now(); frame(now); requestAnimationFrame(loop); }
setInterval(() => { const n = performance.now(); if (n - lastRaf > 300) frame(n); }, 100);
requestAnimationFrame(loop);

/* ---------- render mode: frames driven by __seek(seconds) ---------- */
if (new URLSearchParams(location.search).has('render')) {
  playing = false;
  document.documentElement.classList.add('render');
  document.querySelector('.wm').textContent = '@saitum528';
  // EP04 segment times from audio/timing.json (8 step starts) + end
  const SEG = [0.0, 5.67, 10.14, 15.49, 19.84, 24.71, 29.67, 36.42], END = 44.81;
  // End card only the last 2.8 s (Meta branded-content rule: ≤3 s full-screen)
  const END_CARD_OPEN = +(END - 2.8).toFixed(2);
  window.__seek = s => {
    let i = 0; while (i < 7 && s >= SEG[i + 1]) i++;
    const segEnd = i < 7 ? SEG[i + 1] : END;
    T = (i + Math.min(0.9999, (s - SEG[i]) / (segEnd - SEG[i]))) * DUR;
    draw();
    const showEc = s >= END_CARD_OPEN;
    document.getElementById('endcard').style.display = showEc ? 'flex' : 'none';
    if (showEc) document.getElementById('subtitle').style.display = 'none';
    else if (document.getElementById('subtitle').style.display === 'none') { shown = -1; draw(); }
    return true;
  };
}
</script>
</body>
</html>
