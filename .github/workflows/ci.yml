name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Black format check
        run: uv run black --check src tests

      - name: Mypy
        run: uv run mypy src

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system tools for local renderer
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo apt-get install -y --no-install-recommends espeak-ng
          sudo apt-get install -y --no-install-recommends fonts-tlwg || true
          sudo apt-get install -y --no-install-recommends fontconfig || true
          # Force the font cache so fc-match resolves Thai immediately.
          sudo fc-cache -f >/dev/null || true
          echo "Resolved Thai font:"
          fc-match :lang=th || echo "fc-match not available"
          ls -la /usr/share/fonts/opentype/tlwg/ 2>/dev/null || echo "no tlwg fonts dir"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit + integration tests
        run: uv run pytest -m "unit or integration" --tb=short

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ --tb=short -q

      - name: Smoke test (run_once pipeline)
        run: uv run python -m auto_affi.ops.run_once --product-id 12345

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
