# PROPOSED pyproject.toml for AFFI-S1-01 (agent guard-blocked from writing it directly).
# This is a FRESH creation with STRONG gates (mypy strict, full ruff select, strict-markers,
# filterwarnings=error) — it strengthens quality, it does not weaken anything.
# To place it:   cp _aegis-output/specs/AFFI-S1-01-build-config-proposed.txt pyproject.toml
# Then the agent runs:  uv sync  &&  uv run pytest   (smoke test already present).
# ---------------------------------------------------------------------------------------

[project]
name = "auto-affi"
version = "0.1.0"
description = "Autonomous AI marketing platform for Shopee affiliate (TH) — Phase-1 offline rebuild"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "aegis-team" }]

# Phase-1 offline-first core. Re-decided from 5602e53 per .aegis/brain/sprints/sprint-1/plan.md:
#   KEPT  : pydantic stack + http/retry + structured logging + dotenv (all the offline slice needs).
#   DROPPED for Phase 1 (re-add when gates clear / Phase 2-3):
#     - temporalio  -> ADR-005 deferred; in-process executor for Phase 1
#     - db (asyncpg/pgvector/alembic/sqlalchemy) -> JSONL/CSV registry instead (AFFI-S1-03)
#     - cache (redis), web (fastapi ops console -> Phase 2)
#     - observability (otel/langfuse) -> observability/ was an empty stub; defer
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# LLM agents (Strategist/Writer) — NEVER called in offline dry-run / tests
agents = ["anthropic>=0.40.0"]
# local render + caption stills for the offline slice; ffmpeg binary used via subprocess
pipeline = ["pillow>=10.4.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_affi"]

# --------------------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "C4", "TID"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["auto_affi"]

# --------------------------------------------------------------------------- Black
[tool.black]
line-length = 100
target-version = ["py312"]

# --------------------------------------------------------------------------- Mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=auto_affi", "--cov-report=term-missing"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (vendor APIs via VCR)",
    "e2e: end-to-end pipeline tests (sandbox vendors)",
    "slow: tests that take > 5s",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/auto_affi"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]
